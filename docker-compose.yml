# =============================================================================
# docker-compose.yml
# Airflow 2.8 setup for GraphRAG Cybersecurity Pipeline
# Team 3 | DATA 298A
#
# Services:
#   - postgres        : Airflow metadata database
#   - redis           : Celery broker (task queue)
#   - airflow-init    : One-time DB init + admin user creation
#   - airflow-webserver: Airflow UI at http://localhost:8080
#   - airflow-scheduler: Picks up DAGs and schedules tasks
#   - airflow-worker  : Executes tasks (runs your Python + dbt)
#
# Usage:
#   1. Place this file at the root of cybersec_pipeline/
#   2. Run: docker-compose up -d
#   3. Open: http://localhost:8080  (admin / admin)
#   4. Add Connections in Admin → Connections (duckdb_default, clickhouse_default)
# =============================================================================

version: '3.8'

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_FOLDER: '/opt/Airflow/dags'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'

    # ── pip packages installed at container startup ──────────────────────────
    # All packages your DAG needs: dbt adapters, cosmos, DuckDB, ClickHouse,
    # data processing, and web scraping
    _PIP_ADDITIONAL_REQUIREMENTS: >-
      dbt-core==1.7.0
      dbt-duckdb==1.7.0
      dbt-clickhouse==1.7.0
      astronomer-cosmos==1.3.0
      duckdb==0.10.0
      clickhouse-connect==0.7.0
      pandas==2.1.0
      fastparquet==2023.10.1
      beautifulsoup4==4.12.2
      requests==2.31.0
      numpy==1.26.0

  volumes:
    # DAG files
    - ./dags:/opt/Airflow/dags
    # dbt project (models, profiles, sources, schema)
    - ./dbt:/opt/Airflow/dbt
    # data folder (CSV input + auto-created UWF_Data/ + DuckDB file)
    - ./data:/opt/Airflow/data
    # Airflow logs
    - airflow-logs:/opt/Airflow/logs
    # Airflow plugins (empty but needed)
    - airflow-plugins:/opt/Airflow/plugins

  user: "${AIRFLOW_UID:-50000}:0"

  depends_on: &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

# =============================================================================
# SERVICES
# =============================================================================

services:

  # ── Postgres: Airflow metadata DB ─────────────────────────────────────────
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # ── Redis: Celery broker ───────────────────────────────────────────────────
  redis:
    image: redis:7.2-bookworm
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always

  # ── Airflow init: DB migration + admin user ────────────────────────────────
  # Runs once on first `docker-compose up`, then exits.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /sources/logs /sources/dags /sources/plugins
        chown -R "${AIRFLOW_UID}:0" /sources/{logs,dags,plugins}
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-admin}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"
    volumes:
      - .:/sources

  # ── Airflow webserver: UI at http://localhost:8080 ─────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ── Airflow scheduler: reads DAGs, creates task instances ─────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ── Airflow worker: executes tasks ────────────────────────────────────────
  # This is the container that actually runs your Python tasks and dbt models.
  # All pip packages listed in _PIP_ADDITIONAL_REQUIREMENTS are installed here.
  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ── Airflow triggerer: for deferred operators ──────────────────────────────
  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  postgres-db-volume:
  airflow-logs:
  airflow-plugins: